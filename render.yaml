# Render.com deployment configuration
# See: https://docs.render.com/infrastructure-as-code

services:
  - type: web
    name: observatory-qa
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: STORAGE_BACKEND
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: observatory-qa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: observatory-qa-redis
          type: redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Required in production — server/index.ts exits at startup without a
      # 64-char hex key. Set the same value on the worker service below.
      - key: PHI_ENCRYPTION_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false

  - type: worker
    name: observatory-qa-workers
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node dist/workers.js
    envVars:
      - key: NODE_ENV
        value: production
      # Without this the worker falls back to MemStorage (initPostgresStorage
      # requires STORAGE_BACKEND=postgres) and its jobs write nowhere.
      - key: STORAGE_BACKEND
        value: postgres
      # Must match the web service's key — workers decrypt PHI (EHR note push).
      - key: PHI_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: observatory-qa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: observatory-qa-redis
          type: redis
          property: connectionString
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false

  - type: redis
    name: observatory-qa-redis
    plan: starter
    # BullMQ requires noeviction — an LRU policy can silently evict queued jobs
    # and session keys under memory pressure.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: observatory-qa-db
    plan: starter
    postgresMajorVersion: "16"
    ipAllowList: []
